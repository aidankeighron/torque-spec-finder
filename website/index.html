<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torque Spec Finder — mockup</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="mock-banner">
  <strong>Mockup</strong> — static data, no backend. Use the state switcher to see each case.
</div>

<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <span class="brand-mark">◎</span>
      <span>Torque Spec Finder</span>
    </div>

    <!-- The vehicle is a HARD FILTER, never parsed from the question.
         It stays pinned because every result depends on it. -->
    <div class="vehicle" id="vehicle-bar">
      <label>Year <select id="v-year"><option>2003</option><option>2002</option><option>2004</option></select></label>
      <label>Model <select id="v-model"><option>Corvette (C5)</option></select></label>
      <label>Trim <select id="v-trim"><option>Base</option><option>Z06</option></select></label>
      <label>Engine <select id="v-engine"><option>LS1 5.7L</option></select></label>
      <label>Trans <select id="v-trans"><option>MN6 manual</option><option>M30 auto</option></select></label>
    </div>
  </div>
</header>

<main class="wrap">

  <form class="searchbar" id="search-form" autocomplete="off">
    <input id="q" type="text" placeholder="e.g. rear sway bar bottom bolt" aria-label="Search">
    <button type="submit">Look up</button>
  </form>

  <nav class="states" aria-label="Mockup states">
    <span class="states-label">States:</span>
    <button class="state-btn is-active" data-state="confident">1 · Confident</button>
    <button class="state-btn" data-state="ambiguous">2 · Ambiguous</button>
    <button class="state-btn" data-state="conflict">3 · Conflict</button>
    <button class="state-btn" data-state="superseded">4 · Superseded</button>
    <button class="state-btn" data-state="multistage">5 · Multi-stage / TTY</button>
  </nav>

  <section id="result" aria-live="polite"></section>

</main>

<footer class="wrap foot">
  Numbers are rendered from database columns, never generated.
  See <code>docs/04-accuracy-architecture.md</code>.
</footer>

<script src="mock-data.js"></script>
<script src="app.js"></script>
</body>
</html>
